name: Alpine musl

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: alpine-musl-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static musl binary
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            rust:1-alpine \
            sh -euc '
              apk add --no-cache build-base cmake pkgconf linux-headers
              rustc -vV
              rustc -vV | grep -q "host: x86_64-unknown-linux-musl"
              export ZSTD_SYS_USE_PKG_CONFIG=0
              export RUSTFLAGS="-C target-feature=+crt-static"
              cargo build --release --locked
              mkdir -p dist
              cp target/release/pingora-waf dist/pingora-waf
              chmod 755 dist/pingora-waf
            '

      - name: Verify musl binary on Alpine
        run: |
          sudo apt-get update
          sudo apt-get install -y file
          file dist/pingora-waf
          file dist/pingora-waf | grep -Eq "statically linked|static-pie"
          docker run --rm \
            -v "${PWD}/dist/pingora-waf:/pingora-waf:ro" \
            alpine:3 \
            /pingora-waf --version

      - name: Package
        id: package
        run: |
          ref="${GITHUB_REF_NAME}"
          name="pingora-waf-${ref}-x86_64-unknown-linux-musl"
          mkdir -p "pack/${name}/config"
          cp dist/pingora-waf "pack/${name}/pingora-waf"
          cp config/*.yaml "pack/${name}/config/"
          tar -C pack -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingora-waf-${{ github.ref_name }}-x86_64-unknown-linux-musl
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$tag" \
              --generate-notes
          fi
          gh release upload "$tag" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
